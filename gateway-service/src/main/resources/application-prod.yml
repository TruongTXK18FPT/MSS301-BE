# Gateway Service - Production Configuration
server:
  port: 8080

app:
  api:
    prefix: /api/v1
  service-prefix:
    auth: /authenticate
    payment: /payment
    premium: /premium
    mindmap: /mindmap
    content: /content
    chatbot: /chatbot
    profile: /profile
    classroom: /classrooms
    media: /media
    document: /document
    retrieval: /retrieval
    rag: /rag

spring:
  application:
    name: gateway-service

  cloud:
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 120s
            pool:
              max-connections: 1000
              max-idle-time: 30s
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            corsConfigurations:
              "[/**]":
                allowedOriginPatterns:
                  - "https://mss301.me"
                  - "https://*.mss301.me"
                  - "http://localhost:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          # Routes are configured in Java: GatewayRouteConfig.java
          # Reason: Spring Cloud Gateway Server Webflux 4.3.0 does not support
          # shorthand YAML syntax (Path=...) in production JAR runtime

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
    # Retry configuration for resilient Eureka connection
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
    # Disable initial registry fetch to avoid blocking on startup
    should-enforce-registration-at-init: false
  instance:
    preferIpAddress: true
    # Remove hostname to let Eureka auto-detect container IP
    # Faster heartbeat for quicker service discovery
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Force non-secure communication
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
