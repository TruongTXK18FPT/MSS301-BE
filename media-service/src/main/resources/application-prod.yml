# Media Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: media-service

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: media-service
    nonSecurePortEnabled: true
    securePortEnabled: false

# Storage Configuration (if using cloud storage)
storage:
  location: /tmp/media-uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
