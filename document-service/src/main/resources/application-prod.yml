# Document Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: document-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

# Embedding API Configuration
embedding:
  client:
    url: ${EMBEDDING_CLIENT_URL:https://aiportalapi.stu-platform.live/jpe/v1}
    api-key: ${EMBEDDING_CLIENT_API_KEY:sk-Z64PdmBB55a3eXZuLcM2zQ}
    model: text-embedding-3-small

# Google API Configuration (for File Search)
google:
  api:
    key: ${GOOGLE_API_KEY:AIzaSyB0jEvoo8IwoNzZLIQMTF6FLacEFp8ZB_c}
    base-url: https://generativelanguage.googleapis.com

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: document-service
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: false # Disable Elasticsearch health check due to Spring Boot 3.5.5 incompatibility with ES 8.15.0
