# RAG Service - Production Configuration
server:
  port: 8092

spring:
  application:
    name: rag-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: true
    hostname: rag-service

# AI API Configuration
mistral:
  api-key: ${MISTRAL_API_KEY:OYzJvGt3V4IA458SbOMGraxpBkwZyANg}

gemini:
  api-key: ${GEMINI_API_KEY:AIzaSyDtwnAbU30A1r_ixXtuZLZusEcmLa8tzNg}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
