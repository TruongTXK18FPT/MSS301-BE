# Retrieval Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: retrieval-service

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

# Embedding API Configuration
embedding:
  client:
    url: ${EMBEDDING_CLIENT_URL:https://aiportalapi.stu-platform.live/jpe/v1}
    api-key: ${EMBEDDING_CLIENT_API_KEY:sk-Z64PdmBB55a3eXZuLcM2zQ}
    model: text-embedding-3-small

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: retrieval-service
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
