# Content Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: content-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/content_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: content-service
    nonSecurePortEnabled: true
    securePortEnabled: false

# Gemini AI Configuration
gemini:
  apiKey: ${GEMINI_API_KEY:AIzaSyComgm3rKMvMYtc7wXmODfEYkOXogzG6uA}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  maxOutputTokens: ${GEMINI_MAX_OUTPUT_TOKENS:10000}
  temperature: ${GEMINI_TEMPERATURE:0.8}

jwt:
  signerKey: ${JWT_SECRET:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
