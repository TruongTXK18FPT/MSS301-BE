# Use postgres/example user/password credentials

services:
  payment_command_db:
    image: postgres
    restart: on-failure:3
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: 12345
      POSTGRES_USER: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5432:5432"

  # MongoDB for Payment Query (Read Model - CQRS)
  payment_query_db:
    image: bitnami/mongodb:latest
    container_name: payment_query_db
    restart: on-failure:3
    environment:
      MONGODB_ROOT_USER: root
      MONGODB_ROOT_PASSWORD: root
      MONGODB_DATABASE: payment_db
    ports:
      - "27017:27017"
    volumes:
      - payment_mongo_data:/bitnami/mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB UI for development
  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: on-failure:3
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:root@payment_query_db:27017/payment_db?authSource=admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      payment_query_db:
        condition: service_healthy

  auth_db:
    image: postgres
    restart: on-failure:3
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
