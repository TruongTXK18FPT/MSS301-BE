server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port-enabled: true
    secure-port-enabled: false

springdoc:
  api-docs:
    path: /api-docs

spring:
  application:
    name: chatbot-service
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.ai.model.mistralai.autoconfigure.MistralAiChatAutoConfiguration
      - org.springframework.ai.model.mistralai.autoconfigure.MistralAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.mistralai.autoconfigure.MistralAiModerationAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/chatbot_db
    username: postgres
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

service:
  rag:
    url: http://localhost:8093
    name: rag-service

chat:
  api: ${CHAT_API_URL:}
  apiKey: ${CHAT_API_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

mistral:
  api-key: ${MISTRAL_API_KEY:}
  model: ${MISTRAL_MODEL:mistral-large-latest}
  api-url: ${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}