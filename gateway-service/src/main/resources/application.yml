server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework

app:
  api:
    prefix: /api/v1
  service-prefix:
    auth: /authenticate
    payment: /payment
    premium: /premium
    mindmap: /mindmap
    content: /content
    chatbot: /chatbot
    profile: /profile
    classroom: /classroom
    media: /media
    document: /document
    retrieval: /retrieval
    rag: /rag

spring:
  application:
    name: gateway-service
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: http://127.0.0.1:8081
            profile-service:
              - uri: http://127.0.0.1:8087
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
            pool:
              max-connections: 1000
              max-idle-time: 30s
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service #8081
              uri: lb://auth-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.auth}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.auth}/(?<segment>.*), /${segment}

            - id: payment-service #8082
              uri: lb://payment-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.payment}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.payment}/(?<segment>.*), /${segment}

            - id: premium-service #8083
              uri: lb://premium-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.premium}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.premium}/(?<segment>.*), /${segment}

            - id: mindmap-service #8084
              uri: lb://mindmap-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.mindmap}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.mindmap}/(?<segment>.*), /${segment}

            - id: content-service #8085
              uri: lb://content-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.content}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.content}/(?<segment>.*), /${segment}

            - id: chatbot-service #8086
              uri: lb://chatbot-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.chatbot}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.chatbot}/(?<segment>.*), /${segment}

            - id: profile-service #8087
              uri: lb://profile-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.profile}/**,${app.api.prefix}/profile/**,${app.api.prefix}/profile/addresses/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.profile}/(?<segment>.*), /profile/${segment}
                - RewritePath=${app.api.prefix}/profile/(?<segment>.*), /profile/${segment}
                - RewritePath=${app.api.prefix}/profile/addresses/(?<segment>.*), /addresses/${segment}

            - id: classroom-service #8094
              uri: lb://classroom-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.classroom}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.classroom}/(?<segment>.*), /${segment}

            - id: media-service #8089
              uri: lb://media-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.media}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.media}/(?<segment>.*), /${segment}

            - id: document-service #8091
              uri: lb://document-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.document}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.document}/(?<segment>.*), /${segment}

            - id: retrieval-service #8092
              uri: lb://retrieval-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.retrieval}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.retrieval}/(?<segment>.*), /${segment}

            - id: rag-service #8093
              uri: lb://rag-service
              predicates:
                - Path=${app.api.prefix}${app.service-prefix.rag}/**
              filters:
                - RewritePath=${app.api.prefix}${app.service-prefix.rag}/(?<segment>.*), /${segment}

            - id: notification-service #8088
              uri: lb://notification-service
              predicates:
                - Path=${app.api.prefix}/notification/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: false
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1
