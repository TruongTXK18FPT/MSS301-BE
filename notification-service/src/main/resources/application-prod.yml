# Notification Service - Production Configuration
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:9b93a1001@smtp-brevo.com}
    password: ${MAIL_PASSWORD:xsmtpsib-7ab86da2663bd29ae78b9b8ef3b26f2497fd43983c52a0dc1b0f45471489ecb1-ISnAdDB9VXdJ1ET0}
    from: ${MAIL_FROM:no-reply@mss301.me}
    from-name: ${MAIL_FROM_NAME:MSS301-MathMind}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
    # Test connection at startup - Brevo port 2525 not blocked by DigitalOcean
    test-connection: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: notification-service
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
