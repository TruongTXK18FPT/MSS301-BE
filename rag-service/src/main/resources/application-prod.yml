# RAG Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: rag-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: rag-service
    nonSecurePortEnabled: true
    securePortEnabled: false

# AI API Configuration
mistral:
  api-key: ${MISTRAL_API_KEY:OYzJvGt3V4IA458SbOMGraxpBkwZyANg}

gemini:
  api-key: ${GEMINI_API_KEY:AIzaSyDtwnAbU30A1r_ixXtuZLZusEcmLa8tzNg}
  model: gemini-2.5-flash
  file-search:
    api-key: ${GEMINI_FILE_SEARCH_API_KEY:AIzaSyB0jEvoo8IwoNzZLIQMTF6FLacEFp8ZB_c}
    model: gemini-2.5-flash

# FPT AI Configuration (for TTS)
fptai:
  api-key: ${FPTAI_API_KEY:peZ3IXt25wVqC2eRLZKJlgG927wtUAOJ}
  url: https://api.fpt.ai/hmi/tts/v5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
