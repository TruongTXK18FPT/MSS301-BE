# Gateway Service - Production Configuration
server:
  port: 8080

app:
  api:
    prefix: /api/v1
  service-prefix:
    auth: /authenticate
    payment: /payment
    premium: /premium
    mindmap: /mindmap
    content: /content
    chatbot: /chatbot
    profile: /profile
    classroom: /classrooms
    media: /media
    document: /document
    retrieval: /retrieval
    rag: /rag

spring:
  application:
    name: gateway-service

  cloud:
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      # Discovery locator ENABLED - Gateway will auto-create routes from Eureka
      # Static routes in config will also be loaded
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          # Use LoadBalancer (lb://) for service discovery
          url-expression: "'lb://'+serviceId"
          # Include all services from Eureka
          include-expression: "true"
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 120s
            pool:
              max-connections: 1000
              max-idle-time: 30s
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns:
              - "https://mss301.me"
              - "https://*.mss301.me"
              - "http://localhost:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/authenticate/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/v1/authenticate/(?<segment>.*)
                replacement: /${segment}

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/payment/**

        - id: premium-service-plans
          uri: lb://premium-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/premium/plans/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/v1/premium/plans/(?<segment>.*)
                replacement: /plans/${segment}

        - id: premium-service-entitlements
          uri: lb://premium-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/premium/entitlements/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/v1/premium/entitlements/(?<segment>.*)
                replacement: /entitlements/${segment}

        - id: mindmap-service
          uri: lb://mindmap-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/mindmap/**
          filters:
            - name: StripPrefix
              args:
                parts: 3

        - id: content-service
          uri: lb://content-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/content/**

        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/chatbot/**

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/profile/**
          filters:
            - name: StripPrefix
              args:
                parts: 3

        - id: classroom-service
          uri: lb://classroom-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/classroom/**
          filters:
            - name: StripPrefix
              args:
                parts: 3

        - id: media-service
          uri: lb://media-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/media/**

        - id: document-service
          uri: lb://document-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/documents/**
          filters:
            - name: RewritePath
              args:
                regexp: /api/v1/documents/(?<segment>.*)
                replacement: /api/v1/documents/${segment}

        - id: retrieval-service
          uri: lb://retrieval-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/retrieval/**

        - id: rag-service
          uri: lb://rag-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/rag/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - name: Path
              args:
                pattern: /api/v1/notification/**
          filters:
            - name: StripPrefix
              args:
                parts: 3

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
    # Retry configuration for resilient Eureka connection
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
    # Disable initial registry fetch to avoid blocking on startup
    should-enforce-registration-at-init: false
  instance:
    preferIpAddress: true
    # Remove hostname to let Eureka auto-detect container IP
    # Faster heartbeat for quicker service discovery
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Force non-secure communication
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,routes,gateway"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Enable debug logging for Gateway routing
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty: INFO
