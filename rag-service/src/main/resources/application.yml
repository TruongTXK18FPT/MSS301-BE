server:
  port: 8093

spring:
  application:
    name: rag-service

  main:
    allow-bean-definition-overriding: true

  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY:4ibVZkeLmZaZ1MnIA4GF6DMQTkeiHn8f}
      chat:
        options:
          model: mistral-small-latest
          temperature: 0.7
          max-tokens: 2048

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port-enabled: true
    secure-port-enabled: false

external:
  retrieval-service:
    url: http://localhost:8092

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 60000
        loggerLevel: full
      retrieval-service:
        connectTimeout: 5000
        readTimeout: 30000

rag:
  default-top-k: 7
  max-context-length: 4000

gemini:
  api-key: ${GEMINI_API_KEY:AIzaSyCeccru8OmyxoymHlblUrvqJx5-tzM5dhg}
  model: gemini-2.5-flash
  file-search:
    api-key: ${GEMINI_FILE_SEARCH_API_KEY:AIzaSyB0jEvoo8IwoNzZLIQMTF6FLacEFp8ZB_c}
    model: gemini-2.5-flash

logging:
  level:
    root: INFO
    mss301.ragservice: DEBUG
    mss301.ragservice.client: DEBUG
    org.springframework.ai: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

fptai:
  api-key: ${FPTAI_API_KEY:peZ3IXt25wVqC2eRLZKJlgG927wtUAOJ}
  url: https://api.fpt.ai/hmi/tts/v5
