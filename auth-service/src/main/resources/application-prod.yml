# Auth Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/auth_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    stream:
      bindings:
        sendNotification-out-0:
          destination: notification-delivery
        sendUserCreated-out-0:
          destination: user-created-topic
        userCreated-out-0:
          destination: user-created-topic
        teacherRegistration-out-0:
          destination: teacher-registration-topic
        teacherApproval-out-0:
          destination: teacher-approval-topic
        passwordResetOtpDelivery-out-0:
          destination: password-reset-otp-topic
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: auth-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:9b93a1001@smtp-brevo.com}
    password: ${MAIL_PASSWORD:xsmtpsib-7ab86da2663bd29ae78b9b8ef3b26f2497fd43983c52a0dc1b0f45471489ecb1-ISnAdDB9VXdJ1ET0}
    from: ${MAIL_FROM:no-reply@mss301.me}
    from-name: ${MAIL_FROM_NAME:MSS301-MathMind}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
    # Retry configuration for resilient Eureka connection
    registry-fetch-interval-seconds: 10
    eureka-service-url-poll-interval-seconds: 30
    should-enforce-registration-at-init: false
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: auth-service
    # Faster heartbeat for quicker service discovery
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Force non-secure communication
    nonSecurePortEnabled: true
    securePortEnabled: false

jwt:
  secret: ${JWT_SECRET:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}
  expiration: 86400000

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:https://api.mss301.me/api/v1/authenticate/auth/google/callback}

frontend:
  base-url: ${FRONTEND_BASE_URL:https://mss301.me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
