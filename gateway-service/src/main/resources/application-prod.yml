# Gateway Service - Production Configuration
server:
  port: 8080

app:
  api:
    prefix: /api/v1
  service-prefix:
    auth: /authenticate
    payment: /payment
    premium: /premium
    mindmap: /mindmap
    content: /content
    chatbot: /chatbot
    profile: /profile
    classroom: /classrooms
    media: /media
    document: /document
    retrieval: /retrieval
    rag: /rag

spring:
  application:
    name: gateway-service

  cloud:
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 120s
            pool:
              max-connections: 1000
              max-idle-time: 30s
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            corsConfigurations:
              "[/**]":
                allowedOriginPatterns:
                  - "https://mss301.me"
                  - "https://*.mss301.me"
                  - "http://localhost:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.auth}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.auth}/(?<segment>.*), /${segment}

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.payment}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.payment}/(?<segment>.*), /${segment}

        - id: premium-service
          uri: lb://premium-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.premium}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.premium}/(?<segment>.*), /${segment}

        - id: mindmap-service
          uri: lb://mindmap-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.mindmap}/**
          filters:
            - StripPrefix=2

        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.content}/**,${app.api.prefix}/submissions/**,${app.api.prefix}/quiz-attempts/**
          filters:
            - StripPrefix=3

        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.chatbot}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.chatbot}/(?<segment>.*), /${segment}

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.profile}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.profile}/(?<segment>.*), /${segment}

        - id: classroom-service
          uri: lb://classroom-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.classroom}/**
          filters:
            - StripPrefix=2

        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.media}/**
          filters:
            - StripPrefix=0

        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.document}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.document}/(?<segment>.*), /${segment}

        - id: retrieval-service
          uri: lb://retrieval-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.retrieval}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.retrieval}/(?<segment>.*), /${segment}

        - id: rag-service
          uri: lb://rag-service
          predicates:
            - Path=${app.api.prefix}${app.service-prefix.rag}/**
          filters:
            - RewritePath=${app.api.prefix}${app.service-prefix.rag}/(?<segment>.*), /${segment}

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=${app.api.prefix}/notification/**
          filters:
            - StripPrefix=2

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
    # Retry configuration for resilient Eureka connection
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
    # Disable initial registry fetch to avoid blocking on startup
    should-enforce-registration-at-init: false
  instance:
    preferIpAddress: true
    # Remove hostname to let Eureka auto-detect container IP
    # Faster heartbeat for quicker service discovery
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Force non-secure communication
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
