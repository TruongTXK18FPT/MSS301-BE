# Retrieval Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: retrieval-service

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: retrieval-service
    nonSecurePortEnabled: true
    securePortEnabled: false

# FPT AI API Configuration
fptai:
  api-key: ${FPTAI_API_KEY:peZ3IXt25wVqC2eRLZKJlgG927wtUAOJ}

# Embedding API Configuration
embedding:
  api-key: ${EMBEDDING_API_KEY:sk-Z64PdmBB55a3eXZuLcM2zQ}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
