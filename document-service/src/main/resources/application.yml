spring:
  application:
    name: document-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
      thread-name-prefix: doc-processing-

  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 10s
    socket-timeout: 30s

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port-enabled: true
    secure-port-enabled: false

logging:
  level:
    com.mss301.documentservice: INFO
    org.elasticsearch: WARN

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

  processing:
    async: true
    chunk-size: 1000
    chunk-overlap: 200
    min-chars-per-page: 20

  ocr:
    thread-pool-size: 2
    confidence-threshold: 0.7

embedding:
  client:
    url: https://aiportalapi.stu-platform.live/jpe/v1
    api-key: ${AI_PORTAL_API_KEY:sk-Z64PdmBB55a3eXZuLcM2zQ}
    model: text-embedding-3-small

chunking:
  embedding:
    log:
      enabled: false
      interval: 100

google:
  api:
    key: ${GOOGLE_API_KEY:AIzaSyB0jEvoo8IwoNzZLIQMTF6FLacEFp8ZB_c}
    base-url: https://generativelanguage.googleapis.com

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: 8091