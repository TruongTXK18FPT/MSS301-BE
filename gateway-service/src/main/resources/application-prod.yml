# Gateway Service - Production Configuration
server:
  port: 8080

app:
  api:
    prefix: /api/v1
  service-prefix:
    auth: /authenticate
    payment: /payment
    premium: /premium
    mindmap: /mindmap
    content: /content
    chatbot: /chatbot
    profile: /profile
    classroom: /classrooms
    media: /media
    document: /document
    retrieval: /retrieval
    rag: /rag

spring:
  application:
    name: gateway-service

  cloud:
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 120s
            pool:
              max-connections: 1000
              max-idle-time: 30s
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            corsConfigurations:
              "[/**]":
                allowedOriginPatterns:
                  - "https://mss301.me"
                  - "https://*.mss301.me"
                  - "http://localhost:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.auth}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.auth}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.payment}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.payment}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: premium-service
              uri: lb://premium-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.premium}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.premium}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: mindmap-service
              uri: lb://mindmap-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.mindmap}/**"
              filters:
                - name: StripPrefix
                  args:
                    parts: 2

            - id: content-service
              uri: lb://content-service
              predicates:
                - name: Path
                  args:
                    patterns: "${app.api.prefix}${app.service-prefix.content}/**,${app.api.prefix}/submissions/**,${app.api.prefix}/quiz-attempts/**"
              filters:
                - name: StripPrefix
                  args:
                    parts: 3

            - id: chatbot-service
              uri: lb://chatbot-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.chatbot}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.chatbot}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: profile-service
              uri: lb://profile-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.profile}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.profile}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: classroom-service
              uri: lb://classroom-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.classroom}/**"
              filters:
                - name: StripPrefix
                  args:
                    parts: 2

            - id: media-service
              uri: lb://media-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.media}/**"
              filters:
                - name: StripPrefix
                  args:
                    parts: 0

            - id: document-service
              uri: lb://document-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.document}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.document}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: retrieval-service
              uri: lb://retrieval-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.retrieval}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.retrieval}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: rag-service
              uri: lb://rag-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}${app.service-prefix.rag}/**"
              filters:
                - name: RewritePath
                  args:
                    regexp: "${app.api.prefix}${app.service-prefix.rag}/(?<segment>.*)"
                    replacement: "/${segment}"

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - name: Path
                  args:
                    pattern: "${app.api.prefix}/notification/**"
              filters:
                - name: StripPrefix
                  args:
                    parts: 2

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
    # Retry configuration for resilient Eureka connection
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 30
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
    # Disable initial registry fetch to avoid blocking on startup
    should-enforce-registration-at-init: false
  instance:
    preferIpAddress: true
    # Remove hostname to let Eureka auto-detect container IP
    # Faster heartbeat for quicker service discovery
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    # Force non-secure communication
    nonSecurePortEnabled: true
    securePortEnabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
