server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port-enabled: true
    secure-port-enabled: false

springdoc:
  api-docs:
    path: /api-docs

spring:
  application:
    name: payment-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: 12345

  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/payment_db?authSource=admin

  jpa:
    hibernate:
      ddl-auto: create

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

# external values
service:
  url: http://localhost:8080/api/v1
  user: auth-service
  premium: premium-service

# PayOS payment gateway configuration
# Default values are for local development (no profile)
# Use --spring.profiles.active=prod for production (uses application-prod.yml)
payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID:dd239d22-5ff6-4113-bc74-8c71f55147fd}
    api-key: ${PAYOS_API_KEY:9f1a0f8b-fbae-495a-b2f6-52e72ac155ca}
    checksum-key: ${PAYOS_CHECKSUM_KEY:e53324608b59a5614972388adfc79b36b12c2ae5e141470a0d51b82ca6bebc92}
    base-url: https://api-merchant.payos.vn
    # Default to local URLs (for local development)
    # Override with environment variables or use application-prod.yml for production
    webhook-url: ${PAYOS_WEBHOOK_URL:http://localhost:8080/api/v1/payment/callback/payos}
    return-url: ${PAYOS_RETURN_URL:http://localhost:9002/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:9002/payment/cancel}

# Kafka Topics
kafka:
  topic:
    payment-completed: payment-completed-topic
    subscription-request: subscription-request-topic
    subscription-response: subscription-response-topic

