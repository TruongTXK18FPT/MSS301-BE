server:
  port: 8084
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
springdoc:
  api-docs:
    path: /api-docs

spring:
  application:
    name: mindmap-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mindmap_db
    username: postgres
    password: 12345
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

# AI Configuration
ai:
  mistral:
    api-key: ${MISTRAL_API_KEY:OYzJvGt3V4IA458SbOMGraxpBkwZyANg}
    base-url: "https://api.mistral.ai/v1"
    model: "mistral-large-latest"
    timeout: 30000
    max-tokens: 4000
  
  gemini:
    api-key: ${GEMINI_API_KEY:AIzaSyDtwnAbU30A1r_ixXtuZLZusEcmLa8tzNg}
    base-url: "https://generativelanguage.googleapis.com/v1beta"
    models:
      primary: "gemini-2.5-flash"
      fallback-1: "gemini-1.5-flash"
      fallback-2: "gemini-2.0-flash"
    timeout: 30000
    max-tokens: 4000
  
  # AI Service Configuration
  service:
    default-provider: "gemini" # mistral or gemini
    enable-fallback: true
    max-retries: 3
    retry-delay: 1000

# Mindmap Configuration
mindmap:
  max-nodes-per-mindmap: 100
  max-mindmaps-free-user: 1
  max-mindmaps-premium-user: 50
  default-node-color: "#4A90E2"
  default-edge-color: "#7ED321"

# RAG Integration Configuration
rag:
  enabled: true
  document-service:
    url: http://localhost:8091
    timeout: 30000
  retrieval-service:
    url: http://localhost:8092
    timeout: 30000
  rag-service:
    url: http://localhost:8093
    timeout: 60000
  mindmap-generation:
    max-documents: 5
    context-length: 4000
    similarity-threshold: 0.7