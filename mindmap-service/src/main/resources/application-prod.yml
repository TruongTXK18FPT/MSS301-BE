# Mindmap Service - Production Configuration
server:
  port: 8080

spring:
  application:
    name: mindmap-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/mindmap_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    # Use hostname instead of IP for Docker networking
    preferIpAddress: false
    hostname: mindmap-service
    nonSecurePortEnabled: true
    securePortEnabled: false

# AI Configuration
ai:
  mistral:
    api-key: ${MISTRAL_API_KEY:OYzJvGt3V4IA458SbOMGraxpBkwZyANg}
    base-url: "https://api.mistral.ai/v1"
    model: "mistral-large-latest"
    timeout: 30000
    max-tokens: 40000

  gemini:
    api-key: ${GEMINI_API_KEY:AIzaSyDtwnAbU30A1r_ixXtuZLZusEcmLa8tzNg}
    base-url: "https://generativelanguage.googleapis.com/v1beta"
    models:
      primary: "gemini-2.5-flash"
      fallback-1: "gemini-1.5-flash"
      fallback-2: "gemini-2.0-flash"
    timeout: 30000
    max-tokens: 40000

  # AI Service Configuration
  service:
    default-provider: "gemini" # mistral or gemini
    enable-fallback: true
    max-retries: 3
    retry-delay: 1000

# RAG Integration Configuration
rag:
  enabled: true
  document-service:
    url: ${DOCUMENT_SERVICE_URL:http://document-service:8085}
    timeout: 30000
  retrieval-service:
    url: ${RETRIEVAL_SERVICE_URL:http://retrieval-service:8086}
    timeout: 30000
  rag-service:
    url: ${RAG_SERVICE_URL:http://rag-service:8092}
    timeout: 60000
  mindmap-generation:
    max-documents: 5
    context-length: 4000
    similarity-threshold: 0.7

jwt:
  signerKey: ${JWT_SECRET:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
